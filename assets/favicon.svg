<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="magentaArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#d0006f"/>
    </linearGradient>
    <linearGradient id="redRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Camera Shutter Button Dot (Top Left ~ 10:30) -->
  <circle cx="205" cy="140" r="14" fill="#ff1a1a" filter="url(#glow)"/>

  <!-- Lens Central Aperture Glow -->
  <circle cx="250" cy="210" r="90" fill="url(#lensGlow)"/>

  <!-- Outer Cyan Aperture Arc -->
  <path d="M 240 135 A 82 82 0 1 0 265 292" fill="none" stroke="url(#cyanArc)" stroke-width="12" stroke-linecap="round"/>

  <!-- Middle Magenta Aperture Arc -->
  <path d="M 270 142 A 73 73 0 1 1 230 282" fill="none" stroke="url(#magentaArc)" stroke-width="9" stroke-linecap="round"/>

  <!-- Inner Red Aperture Circle -->
  <circle cx="250" cy="210" r="62" fill="none" stroke="url(#redRing)" stroke-width="10"/>

  <!-- Inner Shutter Blades Minimal Lines -->
  <path d="M 230 165 L 265 180" stroke="#ff2a2a" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 285 195 L 270 235" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 260 255 L 225 240" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 205 220 L 220 185" stroke="#ff2a2a" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Text: DCPC -->
  <text x="250" y="365" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="10" text-anchor="middle">
    DCPC
  </text>

  <!-- Text: DHAKA COLLEGE PHOTOGRAPHY CLUB -->
  <text x="250" y="405" font-family="'Inter', 'Roboto', -apple-system, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" letter-spacing="4.5" text-anchor="middle">
    DHAKA COLLEGE PHOTOGRAPHY CLUB
  </text>

</svg>
